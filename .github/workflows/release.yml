# Builds the desktop app for Windows, macOS and Linux when a version tag (v1.2.3) is pushed, and
# publishes them as a GitHub release with a name and notes from scripts/release-notes.mjs.
# Start one with: npm run release -- patch | minor | major
name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build, e.g. v0.2.0
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  notes:
    name: Name and notes
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.id }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0 # all tags and history, for the name and the change list
      - name: Tag matches the app version
        run: |
          app=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "v$app" != "$TAG" ]; then
            echo "::error::Tag $TAG but the app says $app. Use 'npm run release' to bump both."
            exit 1
          fi
      - name: Draft the release
        id: create
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title=$(node scripts/release-notes.mjs "$TAG" notes.md)
          cat notes.md >> "$GITHUB_STEP_SUMMARY"
          api="repos/$GITHUB_REPOSITORY/releases"
          # The id comes straight from the create/update call: a fresh draft isn't findable by tag yet.
          if existing=$(gh release view "$TAG" --json databaseId --jq .databaseId 2>/dev/null); then
            # Rebuilding: refresh the name and notes but leave a published release visible. Moving
            # a tag turns a draft's tag into "untagged-…"; tag_name puts it back so the APK and
            # publish steps, which find the release by tag, still can.
            id=$(gh api -X PATCH "$api/$existing" -f tag_name="$TAG" -f name="$title" -F body=@notes.md --jq .id)
          else
            id=$(gh api "$api" -f tag_name="$TAG" -f name="$title" -F draft=true -F body=@notes.md --jq .id)
          fi
          test -n "$id"
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.name }})
    needs: notes
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: ''
          - name: macOS
            os: macos-latest
            args: --target universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
          - name: Linux
            os: ubuntu-22.04 # oldest supported glibc, so the AppImage runs on more distros
            args: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Linux build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Inkwell's one permanent signing key: every installer gets a .sig next to it.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.notes.outputs.release_id }}
          args: ${{ matrix.args }}

  android:
    name: Build (Android APK)
    needs: notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Build the APK
        # The runner image has the Android SDK and NDK; the Android project is generated fresh.
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          npx tauri android init --ci
          npx tauri icon src-tauri/icons/icon.png
          npx tauri android build --apk --ci
      - name: Sign the APK
        # A permanent key (repo secrets ANDROID_KEYSTORE = base64 .jks with alias "inkwell", and
        # ANDROID_KEYSTORE_PASSWORD) lets new versions install over old ones. Without it a one-off
        # key is made: the APK works, but updating needs the old version uninstalled first.
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          apk=$(ls src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk | head -1)
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > release.jks
            pass="$KEYSTORE_PASSWORD"
          else
            pass="inkwell-$GITHUB_RUN_ID"
            keytool -genkeypair -keystore release.jks -alias inkwell -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass "$pass" -keypass "$pass" -dname "CN=Inkwell"
            echo "::warning::No ANDROID_KEYSTORE secret: signed with a one-off key."
          fi
          "$tools/zipalign" -f -p 4 "$apk" aligned.apk
          "$tools/apksigner" sign --ks release.jks --ks-pass "pass:$pass" --ks-key-alias inkwell \
            --out "Inkwell_${TAG#v}_android.apk" aligned.apk
          "$tools/apksigner" verify "Inkwell_${TAG#v}_android.apk"
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "Inkwell_${TAG#v}_android.apk" --clobber

  publish:
    name: Publish
    needs: [notes, build, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Checksums for every file, signed with Inkwell's key
        env:
          GH_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          mkdir files && cd files
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY"
          rm -f SHA256SUMS.txt*
          sha256sum -- * | grep -v '\.sig$' > ../SHA256SUMS.txt
          cd ..
          npx --yes @tauri-apps/cli@2 signer sign SHA256SUMS.txt
          # Tauri writes the signature base64-wrapped; unwrapped it's a standard minisign file.
          base64 -d SHA256SUMS.txt.sig > SHA256SUMS.txt.minisig
          gh release upload "$TAG" SHA256SUMS.txt SHA256SUMS.txt.minisig --clobber --repo "$GITHUB_REPOSITORY"
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
