# Builds the desktop app for Windows, macOS and Linux when a version tag (v1.2.3) is pushed, and
# publishes them as a GitHub release with a name and notes from scripts/release-notes.mjs.
# Start one with: npm run release -- patch | minor | major
name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build, e.g. v0.2.0
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  notes:
    name: Name and notes
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.id }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0 # all tags and history, for the name and the change list
      - name: Tag matches the app version
        run: |
          app=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "v$app" != "$TAG" ]; then
            echo "::error::Tag $TAG but the app says $app. Use 'npm run release' to bump both."
            exit 1
          fi
      - name: Draft the release
        id: create
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title=$(node scripts/release-notes.mjs "$TAG" notes.md)
          cat notes.md >> "$GITHUB_STEP_SUMMARY"
          api="repos/$GITHUB_REPOSITORY/releases"
          # The id comes straight from the create/update call: a fresh draft isn't findable by tag yet.
          if existing=$(gh release view "$TAG" --json databaseId --jq .databaseId 2>/dev/null); then
            id=$(gh api -X PATCH "$api/$existing" -f name="$title" -F draft=true -F body=@notes.md --jq .id)
          else
            id=$(gh api "$api" -f tag_name="$TAG" -f name="$title" -F draft=true -F body=@notes.md --jq .id)
          fi
          test -n "$id"
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.name }})
    needs: notes
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: ''
          - name: macOS
            os: macos-latest
            args: --target universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
          - name: Linux
            os: ubuntu-22.04 # oldest supported glibc, so the AppImage runs on more distros
            args: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Linux build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          releaseId: ${{ needs.notes.outputs.release_id }}
          args: ${{ matrix.args }}

  publish:
    name: Publish
    needs: [notes, build]
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
