<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inkwell</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#18181b" />
    <link rel="icon" href="/icons/icon-256.png" />
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <aside id="sidebar" aria-label="Notebooks"></aside>
    <main id="stage">
      <canvas id="bg"></canvas>
      <div id="wet"><canvas id="live"></canvas><canvas id="tip"></canvas></div>
      <div id="texts"></div>
      <canvas id="laser"></canvas>
      <div id="toolbar" role="toolbar" aria-label="Tools"></div>
      <button type="button" id="toolbar-fab" class="fab" hidden></button>
      <button type="button" id="sidebar-open" class="fab corner-left" aria-label="Show sidebar" title="Show sidebar (Ctrl+\)" hidden></button>
      <div id="corner" class="pill"></div>
      <nav id="pager" class="pill pager" aria-label="Page"></nav>
      <button type="button" id="zoom" class="chip" title="Zoom options">100%</button>
    </main>
  </body>
</html>
