[package]
name = "onenote-import"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Inkwell's OneNote (.one) importer, compiled to WebAssembly"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
onenote_parser = { path = "vendor/onenote_parser", default-features = false }
typed-path = "0.12"
serde_json = "1"
base64 = "0.22"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cast_precision_loss = "allow"
