[package]
name = "inkwell"
version = "0.2.7"
edition = "2024"

[lib]
name = "inkwell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
percent-encoding = "2"
# Tauri's generated config code needs it once tauri.conf.json has a "plugins" section.
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

# Phones and tablets: saving exports to the content links Android's save dialog returns.
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-fs = "2"

# Desktop: installing updates in the app (Android installs a downloaded APK instead).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-process = "2"
tauri-plugin-updater = "2"

# Linux: WebKitGTK reports a pen as a mouse; GTK's own pen events fill in what it drops.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
webkit2gtk = { version = "2.0", features = ["v2_40"] }

# Windows: switching off WebView2's own pinch zoom (it scaled the whole app, not the page).
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
panic = "abort"

[lints.rust]
# deny, not forbid: the one WebView2 settings call (COM) is unsafe; see no_pinch_zoom.
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
